<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Escala NEVES</title>
<meta name="theme-color" content="#F5C49D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Escala NEVES">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #f2f2f2; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- A escala vem do app do Google (Apps Script), que exige login e e-mail liberado no painel. Esta página não guarda nenhum dado. -->
<iframe src="https://script.google.com/macros/s/AKfycbwqAmFkrwi7m1RHI-hgRs866_RjRUlubFN5QY8h79JAr3mTGXRYOz_5-4xyGnVgrqkn/exec"
        title="Escala NEVES" allow="clipboard-write"></iframe>
<!-- Botão que instala direto como app (sem a barra do Chrome). Só aparece no Android/Chrome quando ainda não está instalado. -->
<button id="instalar" hidden style="position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;padding:14px 22px;border:0;border-radius:28px;background:#4a2508;color:#F5C49D;font:bold 16px Roboto,Arial,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.35)">📲 Instalar o app</button>
<script>
var pedido=null, b=document.getElementById('instalar');
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); pedido=e; b.hidden=false; });
b.onclick=function(){ if(!pedido) return; pedido.prompt(); pedido.userChoice.then(function(){ pedido=null; b.hidden=true; }); };
window.addEventListener('appinstalled',function(){ b.hidden=true; });
</script>
</body>
</html>
